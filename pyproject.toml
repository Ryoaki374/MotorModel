[project]
name = "motor-eddy"
version = "0.1.0"
description = "Bottom-up open-circuit winding eddy-current loss models for coreless PM motors"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
